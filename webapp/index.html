<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Services Store</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/webapp/style.css" />
</head>
<body>
  <div class="store-wrapper">
    
    <!-- Top Bar with Currency Switcher & Search -->
    <div class="store-top-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search services..." autocomplete="off" />
      </div>
      <button id="currencyToggleBtn" class="currency-toggle" title="Switch Currency">
        <span id="currencyFlag">🇮🇳</span> <span id="currencyLabel">INR (₹)</span>
      </button>
    </div>

    <p class="store-subtitle">Tap any service to see options & order</p>

    <!-- Services Button List (Matches the reference image exactly) -->
    <main class="services-container">
      <div id="servicesList" class="services-list">
        <div class="loading-box">
          <div class="spinner"></div>
          <p>Loading services...</p>
        </div>
      </div>
    </main>

    <!-- Service Details & Order Modal -->
    <div id="serviceModal" class="modal-backdrop hidden">
      <div class="modal-card">
        <button id="modalCloseBtn" class="modal-close-btn" aria-label="Close">&times;</button>
        
        <div class="modal-header">
          <h2 id="modalTitle">SERVICE TITLE</h2>
          <div class="modal-badges">
            <span id="modalPrice" class="badge-price">₹2,999</span>
            <span id="modalDuration" class="badge-duration">⏱️ 2-3 Days</span>
          </div>
        </div>

        <div class="modal-content-body">
          <div class="description-box">
            <h4>Description</h4>
            <p id="modalDesc">Service details description...</p>
          </div>

          <div class="requirements-box">
            <label for="orderRequirements">Your Project Instructions / Requirements:</label>
            <textarea id="orderRequirements" rows="3" placeholder="Enter your instructions, details, links, or preferences..."></textarea>
          </div>

          <div id="modalStatusMsg" class="modal-status hidden"></div>
        </div>

        <div class="modal-footer">
          <button id="modalOrderSubmitBtn" class="action-submit-btn">
            ⚡ PROCEED TO ORDER
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="/webapp/app.js"></script>
</body>
</html>
